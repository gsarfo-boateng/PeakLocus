name: Build Linux Native

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show environment
        run: |
          java --version
          javac --version
          native-image --version
          mvn --version
          uname -a

      - name: Run full PeakLocus build and tests
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build Linux native executable
        run: |
          mvn clean package -Pnative

      - name: Smoke test native executable
        run: |
          ./target/peaklocus --version
          ./target/peaklocus -h

      - name: Compare JAR and native output
        run: |
          java -jar target/peaklocus-1.0.0.jar \
            -i examples/input/bed6.bed \
            -g examples/reference/mini.gtf \
            -o /tmp/peaklocus.jar.tsv

          ./target/peaklocus \
            -i examples/input/bed6.bed \
            -g examples/reference/mini.gtf \
            -o /tmp/peaklocus.native.tsv

          cmp /tmp/peaklocus.jar.tsv /tmp/peaklocus.native.tsv

      - name: Package Linux x86_64 release
        run: |
          mkdir -p release/peaklocus-1.0.0-linux-x86_64

          cp target/peaklocus \
            release/peaklocus-1.0.0-linux-x86_64/peaklocus

          cp README.md LICENSE \
            release/peaklocus-1.0.0-linux-x86_64/

          chmod 755 \
            release/peaklocus-1.0.0-linux-x86_64/peaklocus

          cd release

          tar -czf peaklocus-1.0.0-linux-x86_64.tar.gz \
            peaklocus-1.0.0-linux-x86_64

          sha256sum peaklocus-1.0.0-linux-x86_64.tar.gz \
            > peaklocus-1.0.0-linux-x86_64.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: peaklocus-1.0.0-linux-x86_64
          path: |
            release/peaklocus-1.0.0-linux-x86_64.tar.gz
            release/peaklocus-1.0.0-linux-x86_64.tar.gz.sha256

      - name: Add Linux build to v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 \
            release/peaklocus-1.0.0-linux-x86_64.tar.gz \
            release/peaklocus-1.0.0-linux-x86_64.tar.gz.sha256 \
            --clobber
